<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murugasen T &middot; 1965&ndash;2026</title>
<meta name="description" content="In loving memory of Murugasen T — a life of quiet devotion, 12 February 1965 to 25 June 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,560;9..144,650&family=Karla:wght@400;500;600&family=Noto+Serif+Tamil:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sage:#97CE9E;
    --sage-light:#BBDDBC;
    --mist:#E4EFE3;
    --sky:#8DC3E1;
    --ink:#243329;
    --ink-soft:#4A5C50;
    --gold:#C6A24E;
    --paper:#FBFCF9;
    --max: 760px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Karla', sans-serif;
    font-size:17px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:560;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin:0;
  }
  html[data-lang="ta"] body{ font-family:'Noto Sans Tamil','Karla', sans-serif; }
  html[data-lang="ta"] h1, html[data-lang="ta"] h2, html[data-lang="ta"] h3, html[data-lang="ta"] .display{
    font-family:'Noto Serif Tamil','Fraunces', serif;
    font-weight:600;
    letter-spacing:0;
  }
  html[data-lang="ta"] .tagline, html[data-lang="ta"] .t-year, html[data-lang="ta"] blockquote{
    font-family:'Noto Serif Tamil','Fraunces', serif;
    font-style:normal;
  }
  html[data-lang="ta"] .eyebrow{ letter-spacing:.04em; }

  .wrap{max-width:var(--max); margin:0 auto; padding:0 28px;}
  a{color:inherit;}

  .lang-toggle{
    position:fixed;
    top:18px; right:18px;
    z-index:50;
    display:flex;
    background:var(--paper);
    border:1px solid var(--sage-light);
    border-radius:999px;
    padding:3px;
    box-shadow:0 8px 20px -10px color-mix(in srgb, var(--ink) 40%, transparent);
  }
  .lang-toggle button{
    border:none;
    background:transparent;
    font-family:'Karla', sans-serif;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.03em;
    padding:7px 14px;
    border-radius:999px;
    cursor:pointer;
    color:var(--ink-soft);
    transition:background .25s ease, color .25s ease;
  }
  .lang-toggle button.active{
    background:var(--sage);
    color:#1c2b21;
  }

  .hero{
    position:relative;
    padding:88px 28px 72px;
    text-align:center;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--sage-light) 0%, var(--mist) 45%, var(--paper) 78%);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, color-mix(in srgb, var(--ink) 6%, transparent) 1px, transparent 1.4px);
    background-size: 22px 22px;
    opacity:.35;
    pointer-events:none;
  }
  .hero-inner{position:relative; z-index:1;}
  .eyebrow{
    font-family:'Karla',sans-serif;
    font-size:12.5px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:26px;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  .eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--gold);}
  .portrait{
    width:168px; height:168px;
    border-radius:50%;
    object-fit:cover;
    margin:0 auto 30px;
    border:4px solid var(--paper);
    box-shadow:0 0 0 1.5px var(--sage), 0 18px 40px -18px color-mix(in srgb, var(--ink) 45%, transparent);
    display:block;
  }
  .hero h1{
    font-size:clamp(38px, 7vw, 60px);
    line-height:1.05;
  }
  .dates{
    margin-top:22px;
    font-size:15.5px;
    color:var(--ink-soft);
    letter-spacing:.03em;
  }
  .dates .sep{color:var(--sky); margin:0 10px; font-weight:600;}
  .tagline{
    margin-top:28px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:450;
    font-size:20px;
    color:var(--ink);
    max-width:440px;
    margin-left:auto; margin-right:auto;
  }

  .intro{ padding:64px 28px 8px; }
  .intro p{ font-size:18px; color:var(--ink-soft); text-align:center; }
  .intro p + p{margin-top:18px;}

  .section-head{ padding:80px 28px 8px; text-align:center; }
  .section-head .eyebrow{margin-bottom:14px;}
  .section-head h2{ font-size:clamp(26px,4.5vw,34px); }

  .timeline{
    position:relative;
    max-width:820px;
    margin:48px auto 0;
    padding:0 28px 40px;
  }
  .timeline::before{
    content:"";
    position:absolute;
    top:0; bottom:40px; left:50%;
    width:2px;
    transform:translateX(-1px);
    background:linear-gradient(180deg, var(--sage) 0%, var(--sage-light) 35%, var(--sky) 100%);
  }
  .t-item{
    position:relative;
    width:calc(50% - 40px);
    padding:0 0 56px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .t-item.show{opacity:1; transform:translateY(0);}
  .t-item:nth-child(odd){margin-right:auto; text-align:right;}
  .t-item:nth-child(even){margin-left:auto; text-align:left;}
  .t-item .node{
    position:absolute; top:2px;
    width:13px; height:13px;
    border-radius:50%;
    background:var(--paper);
    border:2.5px solid var(--sage);
  }
  .t-item:nth-child(odd) .node{right:-46.5px;}
  .t-item:nth-child(even) .node{left:-46.5px;}
  .t-item:nth-child(n+5) .node{border-color:var(--sky);}
  .t-year{
    font-family:'Fraunces', serif;
    font-weight:650;
    font-size:15px;
    color:var(--ink-soft);
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .t-item h3{ font-size:20px; font-weight:560; margin-bottom:8px; }
  .t-item p{ font-size:15.5px; color:var(--ink-soft); margin:0; }
  .t-item.final .node{background:var(--gold); border-color:var(--gold);}
  .t-item.final .t-year{color:var(--gold);}

  .gallery{
    max-width:640px;
    margin:0 auto;
    padding:48px 28px 20px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:18px;
  }
  .g-card{
    position:relative;
    border-radius:6px;
    overflow:hidden;
    background:var(--mist);
    box-shadow:0 14px 30px -18px color-mix(in srgb, var(--ink) 35%, transparent);
  }
  .g-card img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    display:block;
    filter:sepia(8%) saturate(1.02);
  }
  .g-cap{
    padding:10px 12px 14px;
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    font-style:italic;
    font-family:'Fraunces', serif;
  }
  html[data-lang="ta"] .g-cap{ font-family:'Noto Serif Tamil','Fraunces', serif; font-style:normal; }

  .qr-section{
    max-width:420px;
    margin:96px auto 0;
    padding:48px 32px;
    text-align:center;
    background:var(--mist);
    border-radius:16px;
    border:1px solid var(--sage-light);
  }
  .qr-section img{
    width:180px; height:180px;
    display:block;
    margin:22px auto 18px;
    border-radius:10px;
    background:var(--paper);
    padding:12px;
    box-shadow:0 14px 30px -18px color-mix(in srgb, var(--ink) 35%, transparent);
  }
  .qr-heading{
    font-family:'Fraunces', serif;
    font-weight:560;
    font-size:19px;
    margin-top:6px;
  }
  html[data-lang="ta"] .qr-heading{ font-family:'Noto Serif Tamil','Fraunces', serif; }
  .qr-section .qr-note{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
  }
  .qr-section .qr-note code{
    display:block;
    margin-top:8px;
    font-size:12px;
    background:var(--paper);
    border:1px dashed var(--sage);
    border-radius:6px;
    padding:8px 10px;
    color:var(--ink);
    word-break:break-all;
  }

  .tribute{
    margin:96px auto 0;
    max-width:640px;
    padding:64px 28px 96px;
    text-align:center;
    position:relative;
  }
  .tribute::before{
    content:"";
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    width:56px; height:1px;
    background:var(--sky);
  }
  .tribute blockquote{
    margin:0 0 26px;
    font-family:'Fraunces', serif;
    font-weight:450;
    font-style:italic;
    font-size:24px;
    line-height:1.5;
    color:var(--ink);
  }
  .tribute .from{
    font-size:14px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .family-names{
    margin-top:36px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .family-names span{
    padding:6px 14px;
    border:1px solid var(--sage-light);
    border-radius:999px;
    background:var(--mist);
  }

  footer{
    text-align:center;
    padding:36px 28px 56px;
    font-size:12.5px;
    color:var(--ink-soft);
    opacity:.75;
  }

  @media (max-width:640px){
    .timeline::before{left:18px;}
    .t-item{width:calc(100% - 46px); margin-left:46px !important; text-align:left !important; padding-bottom:44px;}
    .t-item:nth-child(odd) .node, .t-item:nth-child(even) .node{left:-38.5px; right:auto;}
    .hero{padding:64px 20px 56px;}
    .lang-toggle{top:12px; right:12px;}
  }

  @media (prefers-reduced-motion: reduce){
    .t-item{transition:none; opacity:1; transform:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>

  function applyLang(lang){
    document.documentElement.setAttribute('data-lang', lang);
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      const val = T[lang][key];
      if (val !== undefined) el.innerHTML = val;
    });
    document.querySelectorAll('.lang-toggle button').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-set-lang') === lang);
    });
    try { localStorage.setItem('tribute-lang', lang); } catch(e) {}
  }

  document.querySelectorAll('.lang-toggle button').forEach(b => {
    b.addEventListener('click', () => applyLang(b.getAttribute('data-set-lang')));
  });

  let startLang = 'en';
  try {
    const saved = localStorage.getItem('tribute-lang');
    if (saved === 'en' || saved === 'ta') startLang = saved;
  } catch(e) {}
  applyLang(startLang);

  const items = document.querySelectorAll('.t-item');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('show');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    items.forEach(i => io.observe(i));
  } else {
    items.forEach(i => i.classList.add('show'));
  }
</script>
